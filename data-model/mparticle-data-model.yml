    type: integer (64-bit)
    description: >-
      The mParticle ID. The canonical cross-device, cross-channel identifier for a person,
      returned by every IDSync operation and stamped on every resolved batch. Every other
      identity type resolves to exactly one MPID.
    issued_by: mParticle IDSync API
  - name: data_plan_id
    type: string
    description: Workspace-scoped data plan identifier.
  - name: workspace_id
    type: integer
    description: Path/server variable on every Platform v2 URL.
  - name: apiKey
    type: string
    description: Per-input workspace credential; determines which input a batch is attributed to.
