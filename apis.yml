aid: mparticle
name: mParticle
description: >-
  mParticle is a customer data platform (CDP) that helps brands collect,
  unify, and activate customer data across mobile, web, OTT, and server
  sources, then forward it in real time to hundreds of analytics, marketing,
  and warehouse destinations. The mParticle developer platform exposes server
  Events, IDSync, Profile, Warehouse Sync, Calculated Attributes, Data Planning
  and Platform APIs that let teams ingest events, resolve identity, manage
  configurations, and orchestrate audiences using HTTP Basic, an HMAC request
  digest, and OAuth 2.0 client-credentials bearer tokens. mParticle was acquired
  by Rokt.
