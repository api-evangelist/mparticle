- aid: mparticle:platform-api
  name: mParticle Platform API
  description: >-
    Management REST API used to programmatically configure mParticle inputs, outputs, filters, audiences,
    data plans, and workspace settings as part of a fully versioned CDP-as-code workflow. Authenticates
    with an OAuth 2.0 client-credentials bearer token from sso.auth.mparticle.com.
  humanURL: https://docs.mparticle.com/developers/apis/platform/overview/
  baseURL: https://api.mparticle.com/platform/v2
  tags:
  - REST
  - Management
  - Inputs
  - Outputs
  - Data Plans
  - Bearer Token
  properties:
  - type: Documentation
    url: https://docs.mparticle.com/developers/apis/platform/overview/
- aid: mparticle:warehouse-sync-api
  name: mParticle Warehouse Sync API
  description: >-
    REST API for building reverse-ETL pipelines that pull data out of a customer data warehouse (connections,
    data models, field transformations and pipelines) and load it into mParticle profiles and audiences.
    OAuth 2.0 client-credentials bearer auth.
  humanURL: https://docs.mparticle.com/developers/apis/warehouse-sync-api/overview/
  baseURL: https://api.mparticle.com/platform/v2
  tags:
  - REST
  - Warehouse
  - Reverse ETL
  - Pipelines
  - Bearer Token
