note: >-
  Version and published date were read from each registry's metadata endpoint on 2026-08-13.
  mParticle's client-side SDKs are actively released; the SERVER-side SDKs that wrap the Events
  API - Python, Ruby, Node, .NET, Java - have not shipped a release in 1.5 to 5 years even though
  the Events API they wrap is current. That divergence is the notable finding here.
