rfc9457: false
note: >-
  mParticle does not use RFC 9457 application/problem+json. Every mParticle API returns a plain
  application/json envelope with an errors[] array; there is no type URI, no title, and no
  instance. The Platform API wraps the same array in the standard data/dataType envelope. There
  is no published registry of error codes - the only code observed in the specs is BAD_REQUEST,
  carried as an example. Data Planning adds a richer validation error object.
